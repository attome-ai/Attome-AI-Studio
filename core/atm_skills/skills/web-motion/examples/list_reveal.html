<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* A heading and items that tick in one by one on a panel at the right. Transparent: render to a folder. The stagger is --step. */
  :root { --brand: #30b060; --accent: #10a090; --text: #ffffff; --in: 0.2s; --step: 0.32s; --hold: 4.0s; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Segoe UI", "Inter", sans-serif; }
  .panel { position: absolute; right: 115px; top: 50%; transform: translateY(-50%); width: 720px; padding: 40px 44px; border-radius: 18px;
           background: rgba(6, 10, 18, 0.7); box-shadow: 0 20px 60px rgba(0,0,0,.35);
           animation: pop 0.5s cubic-bezier(.16,1,.3,1) var(--in) both, gone 0.35s ease-in calc(var(--in) + var(--hold)) both; }
  h2 { margin: 0 0 22px; color: var(--text); font-size: 52px; font-weight: 800; }
  h2 span { color: var(--brand); }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
  li { display: flex; align-items: center; gap: 18px; color: rgba(255,255,255,.92); font-size: 38px; font-weight: 600;
       animation: item 0.45s cubic-bezier(.16,1,.3,1) both; }
  li::before { content: ""; width: 34px; height: 34px; border-radius: 50%; flex: none;
               background: var(--accent) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>') center / 70% no-repeat; }
  li:nth-child(1) { animation-delay: calc(var(--in) + 0.35s + 0 * var(--step)); }
  li:nth-child(2) { animation-delay: calc(var(--in) + 0.35s + 1 * var(--step)); }
  li:nth-child(3) { animation-delay: calc(var(--in) + 0.35s + 2 * var(--step)); }
  li:nth-child(4) { animation-delay: calc(var(--in) + 0.35s + 3 * var(--step)); }
  li:nth-child(5) { animation-delay: calc(var(--in) + 0.35s + 4 * var(--step)); }
  @keyframes pop { from { opacity: 0; transform: translateY(-50%) scale(.94); } to { opacity: 1; transform: translateY(-50%) scale(1); } }
  @keyframes item { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
  @keyframes gone { to { opacity: 0; transform: translateY(-50%) translateX(40px); } }
</style>
</head>
<body>
  <div class="panel">
    <h2>Digital <span>platforms</span></h2>
    <ul>
      <li>Payment gateways</li>
      <li>Web portals</li>
      <li>Mobile apps</li>
      <li>CRM and ERP</li>
      <li>Integrations</li>
    </ul>
  </div>
</body>
</html>
