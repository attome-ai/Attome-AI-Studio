<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* A big title, a line drawn under it, and a subtitle; staggered in, held, then out. Transparent background: render to a folder. */
  :root { --brand: #10a090; --accent: #7060a0; --text: #ffffff; --in: 0.2s; --hold: 3.2s; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Segoe UI", "Inter", sans-serif; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  .kicker { color: var(--brand); font-size: 34px; font-weight: 700; letter-spacing: 0.35em; text-transform: uppercase;
            animation: rise 0.6s cubic-bezier(.16,1,.3,1) var(--in) both, out 0.35s ease-in calc(var(--in) + var(--hold)) both; }
  h1 { margin: 0; color: var(--text); font-size: 132px; font-weight: 800; letter-spacing: -0.01em; line-height: 1;
       text-shadow: 0 6px 30px rgba(0,0,0,.45);
       animation: rise 0.7s cubic-bezier(.16,1,.3,1) calc(var(--in) + 0.12s) both, out 0.35s ease-in calc(var(--in) + var(--hold) + 0.05s) both; }
  .line { width: 560px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--brand), var(--accent)); transform-origin: left center;
          animation: draw 0.8s cubic-bezier(.65,0,.35,1) calc(var(--in) + 0.35s) both, out 0.3s ease-in calc(var(--in) + var(--hold) + 0.1s) both; }
  .sub { color: rgba(255,255,255,.88); font-size: 44px; font-weight: 500;
         animation: rise 0.6s cubic-bezier(.16,1,.3,1) calc(var(--in) + 0.55s) both, out 0.35s ease-in calc(var(--in) + var(--hold) + 0.15s) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes out { to { opacity: 0; transform: translateY(-20px); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">Chapter one</div>
    <h1>The Big Title</h1>
    <div class="line"></div>
    <div class="sub">A subtitle that says what this part is about</div>
  </div>
</body>
</html>
