<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* An end card: the logo (logo.png in the same folder), a tagline, the web address and contact lines, on a soft brand gradient. Opaque:
     render to an .mp4, or to a folder and lay it over footage with the background removed (delete the body background). */
  :root { --brand: #10a090; --accent: #7060a0; --text: #ffffff; --in: 0.15s; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: "Segoe UI", "Inter", sans-serif;
               background: radial-gradient(ellipse at 50% 40%, #12324a 0%, #0a1426 45%, #04070d 100%); }
  .glow { position: absolute; width: 1400px; height: 1400px; left: 260px; top: -320px; border-radius: 50%;
          background: radial-gradient(circle, rgba(16,160,144,.22), rgba(112,96,160,.10) 45%, transparent 70%);
          animation: breathe 6s ease-in-out both; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
  img { width: 760px; animation: rise 0.8s cubic-bezier(.16,1,.3,1) var(--in) both; }
  .tag { color: rgba(220,245,240,.92); font-size: 40px; font-weight: 500; animation: rise 0.6s cubic-bezier(.16,1,.3,1) calc(var(--in) + .45s) both; }
  .url { color: var(--text); font-size: 82px; font-weight: 800; letter-spacing: .01em; animation: rise 0.6s cubic-bezier(.16,1,.3,1) calc(var(--in) + .75s) both; }
  .contact { display: flex; gap: 48px; color: var(--brand); font-size: 34px; font-weight: 600; animation: rise 0.6s cubic-bezier(.16,1,.3,1) calc(var(--in) + 1s) both; }
  .place { color: rgba(170,190,210,.85); font-size: 28px; animation: rise 0.6s cubic-bezier(.16,1,.3,1) calc(var(--in) + 1.15s) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
  @keyframes breathe { from { transform: scale(.9); opacity: .6; } to { transform: scale(1.05); opacity: 1; } }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <img src="logo.png" alt="">
    <div class="tag">A one-line promise of the company</div>
    <div class="url">example.com</div>
    <div class="contact"><span>hello@example.com</span><span>+000 0000 0000</span></div>
    <div class="place">City, Country</div>
  </div>
</body>
</html>
