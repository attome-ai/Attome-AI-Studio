<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* A coloured tag and a line on a dark panel at the lower left; slides in, holds, slides out. Transparent: render to a folder. */
  :root { --brand: #10a090; --accent: #30b060; --text: #ffffff; --in: 0.15s; --hold: 3.4s; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Segoe UI", "Inter", sans-serif; }
  .card { position: absolute; left: 115px; bottom: 150px; display: flex; flex-direction: column; gap: 14px; padding: 26px 36px 28px 30px;
          background: rgba(6, 10, 18, 0.68); border-left: 8px solid var(--brand); border-radius: 6px 14px 14px 6px; backdrop-filter: blur(6px);
          animation: slide 0.55s cubic-bezier(.16,1,.3,1) var(--in) both, leave 0.35s ease-in calc(var(--in) + var(--hold)) both; }
  .tag { align-self: flex-start; color: #fff; background: var(--brand); font-size: 30px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
         padding: 6px 16px; border-radius: 6px;
         animation: fade 0.4s ease-out calc(var(--in) + 0.2s) both; }
  .line { color: var(--text); font-size: 46px; font-weight: 600;
          animation: fade 0.45s ease-out calc(var(--in) + 0.32s) both; }
  .small { color: rgba(255,255,255,.75); font-size: 30px; font-weight: 500;
           animation: fade 0.45s ease-out calc(var(--in) + 0.44s) both; }
  @keyframes slide { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes leave { to { opacity: 0; transform: translateX(-60px); } }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Consultancy</div>
    <div class="line">Workflow automation and process design</div>
    <div class="small">UI / UX design · Custom development · Training</div>
  </div>
</body>
</html>
